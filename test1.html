<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #flex_parent {

            height: 70vw;
            border: 1px solid black;
            display: flex;
            flex-direction: row;
            justify-content: space-around;
            flex-wrap: wrap;
        }
        #flex_parent div {
            width: 100px;
            background-color: antiqueWhite;
            border: 1px solid;
            box-sizing: border-box;
        }
        #child1 {
            min-height: 50px;
        }
        #child2 {
            min-height: 150px;
        }
        #child3 {
            min-height: 250px;
        }
    </style>
</head>
<body>
    <div id="flex_parent">
        <div id="child1">Child1</div>
        <div id="child2">Child2</div>
        <div id="child3">Child3</div>
    </div>

</body>
</html>
