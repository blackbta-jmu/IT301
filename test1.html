<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice</title>
    <h1> Practice 1</h1>
</head>
<body>
    <ul>
        <li>Red</li>
        <li>Blue</li>
        <li>Green</li>
    </ul>
    <p style="color: purple;">I have a purple dog and</p>
    <p style="color: green;"> and a green cat</p>

    <p>I have a purple dog <br> and a green cat</p>
    <p> What color is your dog?</p>
    <label for="color">Color:</label>
    <input type="text" name="color" placeholder="Enter your dog's color">
    <select name="dog">
        <option value="purple">Purple</option>
        <option value="green">Green</option>
    </select>

    <textarea name="dog" placeholder="Describe your dog's pattern"></textarea>
    <button type="submit">Submit</button>
</body>
</html>
