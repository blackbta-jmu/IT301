<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>letter I</title>
<style>
.i{background-color: black;
display: inline-block;
}
.il,.ir{
    background-color: white;
    display: inline-block;
    width:20px;
    height: 50px;
    
    
}
.il{
    margin: 12px 5px 10px 0;
}
.ir{ margin: 12px 0  10px  5px;

}
.T{
    background-color: black;
    display: inline-block;
    height: 60px;
}
.Tl,.Tr{
    background-color: blue;
    display: inline-block;
    width:20px;
    height: 50px;
}
.Tl{
    margin: 12px 5px 10px 0px;
}
.Tr{ margin: 12px 0px  10px  5px;
}

</style>
</head>
<body>
<div class="i">
    <div class="il"></div>
    <div class="ir"></div>
</div>
<div class="T"> 
    <div class="Tl"></div>
    <div class="Tr"></div>
</div>
</body>
</html>
